[package]
name = "personal-ai-command-center"
version = "0.3.0"
description = "个人 AI 指挥中心 · AI 猎头中枢（独立桌面端）"
authors = ["xuguodong"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
